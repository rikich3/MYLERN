# Redireccion a HTTPS y reto ACME de Let's Encrypt.
server {
  listen 80;
  server_name ${DOMINIO};

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMINIO};

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # --- API del backend (contenedor 01) -------------------------------------
  location /api/ {
    limit_req zone=api burst=40 nodelay;

    # La superficie /api/v1/internal/* es exclusiva de n8n dentro de la red
    # interna de Docker: nunca debe alcanzarse desde Internet.
    location /api/v1/internal/ {
      deny all;
      return 403;
    }

    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /salud {
    proxy_pass http://backend:3000/salud;
  }

  # --- Webhook de Telegram hacia n8n (contenedor 02) -----------------------
  # Telegram entrega los updates aqui; el resto del panel de n8n no se expone.
  location /webhook/ {
    limit_req zone=webhook burst=60 nodelay;
    proxy_pass http://n8n:5678;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- Web app (contenedor 04) ---------------------------------------------
  location / {
    proxy_pass http://webapp:80;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

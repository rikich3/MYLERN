# Contenedor 05 -- reverse proxy tls
# Enruta trafico HTTPS y aisla la red interna de Docker: ni el backend, ni n8n,
# ni Postgres publican puertos al host.
user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format  principal '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time';
  access_log  /var/log/nginx/access.log principal;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;
  client_max_body_size 4m;

  # El endpoint de webhook de Telegram y la API tienen zonas de caudal propias.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=webhook:10m rate=30r/s;

  include /etc/nginx/conf.d/*.conf;
}
